# Pipeline configuration (NFR-MAIN-03: parameters live in configuration, not in code).
# Secrets and the provider/model choice come from .env (see .env.example), never from this file.

paths:
  raw_dir: data/raw
  processed_dir: data/processed          # chunks.jsonl, skipped.jsonl, rejected.jsonl, corpus_manifest.json
  judgment_manifest: data/judgment_manifest.csv
  source_dates: data/raw/source_dates.yaml
  embedding_cache: data/cache/embeddings
  chroma_dir: chroma_db
  reports_dir: reports
  requests_log: logs/requests.jsonl
  prompts_dir: prompts

corpus:
  # Statute/Constitution records with these statuses are not indexed (written to skipped.jsonl).
  skip_statuses: [omitted, repealed, ceased]
  jurisdiction_statutes: Pakistan (federal)
  jurisdiction_constitution: Pakistan (federal)
  jurisdiction_judgments: Sindh
  # If true, a statute whose as_of is still "TODO" in source_dates.yaml is rejected like a missing field.
  # Default false: it is indexed but flagged in the ingestion report (see HANDOFF.md, open questions).
  strict_as_of: false

chunking:
  variant: default                       # name of the active variant in config/chunking_variants.yaml

embeddings:
  # provider comes from EMBEDDINGS in .env: bge_m3_local | openai
  bge_m3_model: BAAI/bge-m3
  max_seq_length: 512
  batch_size: 8
  normalize: true
  device: cpu                            # overridden by EMBED_DEVICE in .env
  # BAAI/bge-m3 ships pytorch_model.bin; with null, newer transformers also downloads a second
  # 2.3 GB safetensors copy of the same weights. false = load the .bin (torch.load weights_only).
  use_safetensors: false

vector_store:
  collection_prefix: lawfiqh            # collection name = <prefix>__<chunking variant>
  distance: cosine

retrieval:
  default_k: 5
  candidate_pool: 50                     # dense and BM25 candidates fused/reranked when R1/R3 are on
  rrf_k: 60                              # reciprocal rank fusion constant
  rerank:                                # R3 settings (used only when stages.reranker is true)
    model: BAAI/bge-reranker-v2-m3       # multilingual cross-encoder, ~2.3 GB, downloaded on first use
    top_n: 15                           # candidates re-scored (more = better recall, slower on CPU)
    max_length: 384
    batch_size: 8
  # Stage switches (FR-RET-06). Only dense is implemented in R0; the others are extension points
  # and raise NotImplementedError if switched on.
  stages:
    query_normaliser: false              # Roman Urdu normaliser (FR-LANG-03)
    bm25_fusion: false                   # R1: BM25 + reciprocal rank fusion (FR-RET-03)
    metadata_filter: false               # R2: jurisdiction/status/date policy filter (FR-RET-04)
    reranker: true                      # R3: cross-encoder rerank (FR-RET-05)
    source_mix: true

llm:
  # provider and model come from LLM_PROVIDER and LLM_MODEL in .env
  temperature: 0
  max_output_tokens: 4096                # cap, not a target; thinking models (e.g. Gemini) count reasoning tokens here
  json_parse_retries: 2                  # extra attempts when the reply is not valid JSON
  api_max_retries: 3                     # transient API errors (SDK back-off)
  timeout_seconds: 120

answering:
  # All off = R0 behaviour. See rag/generation/answer_checks.py.
  evidence_gate:
    enabled: true
    refuse_below: 0.10                   # PROVISIONAL: reranker score of the best passage; calibrate on test questions
    nudge_above: 0.50                    # LLM refused but best passage scored this high -> ask once more
  failed_quotes: retry_then_drop                    # keep (R0: mark verified=false) | retry_then_drop
  history:
    enabled: true                       # condense follow-up + earlier turns into one standalone question
    max_turns: 6

prompts:
  version: v1

eval:
  questions: eval/pilot_questions.csv
  runs: 3
  modes: [c0, c1]
  retrieval_k: 10
